[versions]
# libraries
junit = "4.13.2"
opentest4j = "1.3.0"
hamcrest = "2.2"
# Has to be in sync with IntelliJ Platform
composeuitest = "1.8.0-alpha04"
jewelstandalone = "0.29.0-251.27828"
skikoAwtRuntimeAll = "0.9.22"

# plugins
changelog = "2.2.1"
intelliJPlatform = "2.10.5"
kotlin = "2.1.20"

[libraries]
junit = { module = "junit:junit", version.ref = "junit" }
opentest4j = { module = "org.opentest4j:opentest4j", version.ref = "opentest4j" }
hamcrest = { module = "org.hamcrest:hamcrest", version.ref = "hamcrest" }
composeuitest = { module = "org.jetbrains.compose.ui:ui-test-junit4-desktop", version.ref = "composeuitest" }
jewelstandalone = { module = "org.jetbrains.jewel:jewel-int-ui-standalone", version.ref = "jewelstandalone" }
skikoAwtRuntimeAll = { module = "org.jetbrains.skiko:skiko-awt-runtime-all", version.ref = "skikoAwtRuntimeAll" }

# Gradle plugin artifacts for build-logic (чтобы precompiled script plugin компилился)
kotlinGradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
intellijPlatformGradlePlugin = { module = "org.jetbrains.intellij.platform:org.jetbrains.intellij.platform.gradle.plugin", version.ref = "intelliJPlatform" }
changelogGradlePlugin = { module = "org.jetbrains.changelog:org.jetbrains.changelog.gradle.plugin", version.ref = "changelog" }
composeCompilerGradlePlugin = { module = "org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin", version.ref = "kotlin" }


[plugins]
changelog = { id = "org.jetbrains.changelog", version.ref = "changelog" }
intelliJPlatform = { id = "org.jetbrains.intellij.platform", version.ref = "intelliJPlatform" }
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Builds and verifies the plugin, then prepares a draft GitHub release.
# Publishing that draft triggers the Release workflow.

name: Build

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: 25

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.properties.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5.6.0
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v6

      - name: Export properties
        id: properties
        run: |
          VERSION="$(sed -n 's/^pluginVersion *= *//p' gradle.properties)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build plugin
        run: ./gradlew build buildPlugin

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: project-switcher-${{ steps.properties.outputs.version }}
          path: build/distributions/*.zip

      - name: Collect test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tests-result
          path: build/reports/tests

  verify:
    name: Verify plugin
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - name: Maximize build space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          large-packages: false

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5.6.0
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v6

      - name: Cache Plugin Verifier IDEs
        uses: actions/cache@v6
        with:
          path: ~/.pluginVerifier/ides
          key: plugin-verifier-${{ hashFiles('build/listProductsReleases.txt') }}

      - name: Run Plugin Verifier
        run: ./gradlew verifyPlugin -Dplugin.verifier.home.dir=~/.pluginVerifier

      - name: Collect Plugin Verifier results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pluginVerifier-result
          path: build/reports/pluginVerifier

  release-draft:
    name: Release draft
    if: github.event_name != 'pull_request'
    needs: [ build, verify ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Replace the previous draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh api repos/{owner}/{repo}/releases \
            --jq '.[] | select(.draft == true) | .id' \
            | xargs -r -I '{}' gh api -X DELETE repos/{owner}/{repo}/releases/{}

          gh release create "v$VERSION" --draft --title "v$VERSION" --generate-notes
